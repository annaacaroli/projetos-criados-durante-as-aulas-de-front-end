<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculadora de operações</title>
<style>
:root {
  --primary-color: #4f46e5;
  --primary-hover: #4338ca;
  --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  --card-bg: #ffffff;
  --text-main: #1f2937;
  --text-muted: #4b5563;
  --border-color: #d1d5db;
  --input-bg: #f9fafb;
}

body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg-gradient);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text-main);
}

main {
  width: 100%;
  max-width: 440px;
  padding: 20px;
}

h1 {
  margin-top: 0;
  margin-bottom: 24px;
  color: var(--text-main);
  font-size: 24px;
  font-weight: 600;
  text-align: center;
  letter-spacing: -0.5px;
}

form {
  background-color: var(--card-bg);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  border: none;
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.campo label {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-muted);
}

.campo input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background-color: var(--input-bg);
  font-family: inherit;
  font-size: 16px;
  box-sizing: border-box;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.campo input:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  background-color: #fff;
}

.titulo-opcoes {
  margin: 20px 0 10px;
  font-weight: 600;
  font-size: 14px;
  color: var(--text-muted);
}

.opcoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.opcoes label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background-color: var(--input-bg);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  transition: all 0.2s;
}

.opcoes label:hover {
  background-color: #f3f4f6;
  border-color: #9ca3af;
}

.opcoes input[type="radio"] {
  accent-color: var(--primary-color);
  width: 16px;
  height: 16px;
}

.resultado {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 24px;
}

.resultado label {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-muted);
}

#campo-resultado {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background-color: #f3f4f6;
  font-family: inherit;
  font-size: 18px;
  font-weight: 600;
  color: var(--primary-color);
  box-sizing: border-box;
}

#botao-calcular {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background-color: var(--primary-color);
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  transition: background-color 0.2s, transform 0.1s;
  box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
}

#botao-calcular:hover {
  background-color: var(--primary-hover);
}

#botao-calcular:active {
  transform: scale(0.98);
}
</style>
</head>
<body>
<main>
<h1>Calculadora de Operações</h1>
<form id="formulario-calculadora">
<div class="campo">
<label for="valor1">Valor 1:</label>
<input type="number" id="valor1" name="valor1" step="any" placeholder="Digite o primeiro número" />
</div>
<div class="campo">
<label for="valor2">Valor 2:</label>
<input type="number" id="valor2" name="valor2" step="any" placeholder="Digite o segundo número" />
</div>
<p class="titulo-opcoes">Escolha a operação:</p>
<div class="opcoes">
<label for="soma">
<input type="radio" id="soma" name="operacao" value="soma" />
Soma
</label>
<label for="subtracao">
<input type="radio" id="subtracao" name="operacao" value="subtracao" />
Subtração
</label>
<label for="multiplicacao">
<input type="radio" id="multiplicacao" name="operacao" value="multiplicacao" />
Multiplicação
</label>
<label for="divisao">
<input type="radio" id="divisao" name="operacao" value="divisao" />
Divisão
</label>
</div>
<div class="resultado">
<label for="campo-resultado">Resultado:</label>
<input type="text" id="campo-resultado" name="resultado" readonly placeholder="0" />
</div>
<button type="button" id="botao-calcular">Calcular</button>
</form>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const botaoCalcular = document.getElementById("botao-calcular");

  botaoCalcular.addEventListener("click", () => {
    const valor1 = parseFloat(document.getElementById("valor1").value);
    const valor2 = parseFloat(document.getElementById("valor2").value);
    const campoResultado = document.getElementById("campo-resultado");

    if (isNaN(valor1) || isNaN(valor2)) {
      campoResultado.value = "Preencha os dois valores!";
      return;
    }

    const operacaoSelecionada = document.querySelector('input[name="operacao"]:checked');

    if (!operacaoSelecionada) {
      campoResultado.value = "Escolha uma operação!";
      return;
    }

    const operacao = operacaoSelecionada.value;
    let resultado;

    switch (operacao) {
      case "soma":
        resultado = valor1 + valor2;
        break;
      case "subtracao":
        resultado = valor1 - valor2;
        break;
      case "multiplicacao":
        resultado = valor1 * valor2;
        break;
      case "divisao":
        if (valor2 === 0) {
          campoResultado.value = "Erro: Divisão por zero!";
          return;
        }
        resultado = valor1 / valor2;
        break;
      default:
        resultado = 0;
    }

    campoResultado.value = resultado;
  });
});
</script>
</body>
</html>
